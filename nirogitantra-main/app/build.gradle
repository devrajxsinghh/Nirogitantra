plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.serialization"
}

android {
    namespace "com.example.telemedicine"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.telemedicine"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // BuildConfig flags/keys (example – keep yours if you already set them)
        buildConfigField "String", "GEMINI_API_KEY", "\"${project.findProperty("GEMINI_API_KEY") ?: "AIzaSyCkaj6HS5pyIojORnI8nS9ieJjeAChwbGI"}\""
        buildConfigField "String", "ELEVENLABS_API_KEY", "\"${project.findProperty("ELEVENLABS_API_KEY") ?: "sk_453efeb6fe9f9b8909ac1cb7bd16e22d95809a236cce0803"}\""
        buildConfigField "String", "ELEVENLABS_VOICE_ID", "\"${project.findProperty("ELEVENLABS_VOICE_ID") ?: "EXAVITQu4vr4xnSDxMaL"}\""
        buildConfigField "boolean", "USE_ELEVENLABS_TTS", "${(project.findProperty("USE_ELEVENLABS_TTS") ?: "true")}"
        buildConfigField "String", "SYMPTOM_PREDICTOR_BASE_URL", "\"YOUR_BASE_URL_HERE\"" // Add this
        buildConfigField "String", "SYMPTOM_PREDICTOR_API_KEY", "\"YOUR_API_KEY_HERE\""   // Add this (if you have one)
    }

    buildTypes {
        release {
            minifyEnabled false // <--- Change this line
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // Compose BOM (keeps compose libs aligned)
    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.navigation:navigation-compose:2.8.3"

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3:1.3.0"
    implementation "androidx.compose.material:material-icons-extended"

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Kotlinx Serialization
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"

    // Retrofit + OkHttp + serialization converter
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // ExoPlayer (if you use ElevenLabs TTS playback)
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation 'com.google.android.material:material:1.12.0'
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation("com.google.mlkit:translate:17.0.2")
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
